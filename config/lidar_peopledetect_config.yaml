mecanumbot_lidar_detect_people:
  ros__parameters:
    weight_file: dr_spaam_5_on_frog.pth
    conf_thresh: 0.45
    scan_topic: /mecanumbot/scan
    detections_topic: dr_spaam/dets
    rviz_topic: dr_spaam/marker

    # ---- GPU load control (Jetson Orin Nano) ----
    # stride subsamples the cutout centres fed to the network: 2 halves the
    # number of cutouts, and therefore roughly halves both GPU and CPU time.
    # Set back to 1 for the original (heavier) sampling density.
    stride: 2
    # Cap how often DR-SPAAM actually runs, independent of the LiDAR rate. The
    # Kalman tracker extrapolates the scans in between, so `dets` and
    # `subject_pose` still update at full scan rate. 0.0 disables the cap.
    max_inference_rate: 5.0
    publish_on_skipped_scans: true
    # FP16 autocast for the convolutions. Validated at start-up; the node falls
    # back to FP32 on its own if the model misbehaves in half precision.
    use_amp: true
    cudnn_benchmark: true
    torch_threads: 2
    # Skip inference entirely when no return is closer than this many metres
    # (nothing to detect). 0.0 disables the check.
    idle_skip_range: 0.0
    expected_points: 240
    angle_increment: 0.026
    # Seconds between throughput reports; 0.0 disables them.
    perf_log_period: 0.0

    # ---- tracker (ages in seconds, so it is independent of the rates above) ----
    track_max_distance: 0.5
    track_max_missed_time: 0.4
    track_min_hits: 2
    # A track is only published once it has been seen moving: a 2D LiDAR at
    # ankle height sees table legs and door frames, DR-SPAAM calls some of them
    # people, and almost none of them move. The flag is sticky per track, so a
    # person who walks in and stops stays a person -- but only for as long as
    # that track survives, and close to the robot it does not: two legs half a
    # metre away resolve as one blob and then two, the track is dropped on
    # track_max_missed_time and the replacement has no motion of its own to
    # show. A dropped track therefore leaves its motion evidence behind for
    # track_reseed_memory seconds for a new track within track_reseed_distance
    # to inherit; the replacement still has to be seen track_min_hits times.
    # Setting track_require_motion false publishes stationary detections
    # outright, which also publishes the furniture.
    track_require_motion: true
    track_reseed_memory: 1.5
    track_reseed_distance: 0.5

mecanumbot_cam_detect_people_ds:
  ros__parameters:
    # ---- ROS4HRI (REP-155) output, alongside the mecanumbot-native messages ----
    ros4hri:
      enabled: true
      prefix: /humans
      publish_rate: 30.0
      body_timeout: 0.5
      publish_roi: true
      iou_threshold: 0.3
      # Empty means "reuse the frame the native detections use" (<ns>/head_link).
      frame_id: ''
    # ---- pose model ----
    # The ONNX exports are stored one folder per input size, models/imgsz_<n>/.
    # imgsz picks the folder and model_name the file in it; the node rewrites
    # onnx-file, model-engine-file and infer-dims in a copy of
    # deepstream_config/config_infer_yolo26_pose.txt to match, so the three
    # never drift apart. Both are set from the base launch (yolo_imgsz,
    # yolo_model), which overrides whatever is written here.
    model_params:
      # fp16 | fp32 -- must match network-mode in the nvinfer config
      # (fp16 -> 2, fp32 -> 0), since the precision is part of the engine name.
      precision: fp16
      # Empty means the package share models/ folder. Point it at the source
      # tree on the robot if nvinfer should build its engines where they
      # survive a rebuild.
      models_dir: ''
      # Where DeepStream-Yolo-Pose was built; ~, $HOME and $USER are expanded.
      # Empty tries the custom-lib-path in the nvinfer config, then
      # DeepStream-Yolo-Pose/ under ~/deepstream_source (the robot) and
      # ~/Documents/installed_external (a laptop), so it works on both
      # without being set. Set, it is the only path tried.
      custom_lib_path: ''
      # A complete nvinfer config to hand to nvinfer untouched; setting it
      # disables all of the substitution above.
      nvinfer_config: ''

    # How to invert the nvinfer input resize when mapping keypoints back to
    # pixels: letterbox | stretch | auto (auto reads maintain-aspect-ratio from
    # deepstream_config/config_infer_yolo26_pose.txt). Keep this on auto: the
    # config sets maintain-aspect-ratio=0, so nvinfer stretches rather than
    # pads, and the letterbox mapping then invents padding that is not there --
    # at 1280x720 that puts every joint at 1.78*y - 280 whatever the network
    # size, which is a skeleton stretched off the bottom of its own box.
    keypoint_scaling: auto

    # ---- detection gate ----
    # A detection is accepted on keypoint evidence and temporal consistency,
    # not on the box score alone: a bean bag or an occluder can score a
    # plausible box while producing no coherent skeleton, and a partly
    # occluded person scores lower than one that does. See person_gating.py.
    detection_gate:
      # Box confidence to *acquire* an unknown blob vs. to *retain* one already
      # confirmed. Retain must be the looser of the two -- that hysteresis is
      # what keeps a person who turns away or is briefly occluded.
      # Note the nvinfer pre-cluster-threshold (0.25) is a hard floor: nothing
      # below it ever reaches this node.
      box_conf_acquire: 0.6
      box_conf_retain: 0.35
      # Joint visibility. Decides which keypoints are usable, NOT whether the
      # object is a person, so it is deliberately far below the box gates;
      # raising it to the box threshold is what made distant people lose all
      # their keypoints.
      keypoint_conf: 0.3
      # Keypoint evidence: how much of a body has to be found. This is the
      # check props actually fail. Raise the acquire values if bean bags still
      # get through, lower them if people at range are missed.
      best_keypoint_conf_acquire: 0.7
      best_keypoint_conf_retain: 0.5
      min_valid_keypoints_acquire: 6
      min_valid_keypoints_retain: 3
      # Of the four shoulder/hip joints. A body has a torso; a cushion does not.
      min_torso_keypoints_acquire: 2
      min_torso_keypoints_retain: 1
      # Box geometry, applied in both modes. People are taller than wide;
      # floor props are squat. Raise max_box_aspect_ratio if people are
      # expected seated or very close to the camera.
      min_box_height: 40.0
      max_box_aspect_ratio: 1.6
      # ---- close range ----
      # The camera sits on the head at about 0.22 m with a ~36 deg vertical
      # FOV, so from roughly 3 m in a person's torso is above the top of the
      # frame and only their legs are left: at 0.6 m the camera sees the world
      # from the floor to about 0.4 m. Requiring a torso of them cannot be
      # met, and close is where a person matters most. A box that starts at
      # the top edge (the body continues above the FOV) and fills most of the
      # frame height is therefore judged on these thresholds instead, with the
      # hip/knee/ankle count standing in for the torso -- a panel or a bean
      # bag pressed against the camera has the same geometry but still no leg.
      proximity_enabled: true
      proximity_min_height_fraction: 0.6
      # How near the top edge the box has to start, in pixels and as a
      # fraction of the frame height; the larger of the two wins. The box is
      # drawn round the body the network found, not round the person, so on
      # loose clothing -- a long skirt, a coat -- the top lands tens of pixels
      # inside the frame and an absolute 8 px could not be met: the detection
      # then fell back on the full-body gate and was rejected for a torso that
      # was never in shot. 0.08 is 58 px at 720p.
      proximity_top_margin: 8.0
      proximity_top_fraction: 0.08
      # ... and the escape hatch when even that fails: a box filling this much
      # of the frame is close whatever its top edge does, because nothing far
      # away is that big. The lower-body keypoint count below is what still
      # has to be satisfied, so this does not let a prop through.
      proximity_dominant_height_fraction: 0.85
      # A cropped body scores lower than a whole one, so the box gates drop.
      proximity_box_conf_acquire: 0.4
      proximity_box_conf_retain: 0.3
      # Knees and ankles score lower than faces and shoulders, so the
      # whole-body best_keypoint_conf_* is unmeetable on a legs-only view.
      proximity_best_keypoint_conf_acquire: 0.5
      proximity_best_keypoint_conf_retain: 0.35
      proximity_min_valid_keypoints_acquire: 2
      proximity_min_valid_keypoints_retain: 1
      # Of the six hip/knee/ankle joints. This is what keeps props out.
      proximity_min_lower_body_acquire: 2
      proximity_min_lower_body_retain: 1
      proximity_max_box_aspect_ratio: 2.5
      # Temporal confirmation: frames a blob must pass the acquire gate before
      # it is published, and how long a confirmed track survives without one.
      min_hits: 2
      max_missed_time: 0.5
      iou_threshold: 0.3
      # Logs every rejected box with the check it failed. Verbose; for tuning.
      log_rejections: false

# Fuses the camera bearings with the LiDAR ranges and publishes `people_fusion`,
# which is the single interface the behaviour layer consumes. The node had no
# section here before, so everything below used to be a hard-coded default.
mecanumbot_locate_detections:
  ros__parameters:
    # Metres to place a detection behind a mapped wall it appears to be inside.
    obstacle_buffer_x: 0.5
    debug_mode: false
    # How long the last CamPersonDetectionArray stays usable. The camera is the
    # slower of the two inputs, so its bearings are deliberately re-used
    # between messages -- but only this long: past it the person may have left,
    # and a stale wedge would keep placing them wherever the scan hits inside
    # it. Keep it at a few camera frames.
    cam_detection_timeout: 0.6

    # ---- map-frame tracking (see person_tracking.py) ----
    # A constant-velocity Kalman estimate per person. It exists because the
    # camera gate rejects real people -- a long skirt or a tablecloth gives the
    # pose network no skeleton to find -- and before this every rejection
    # emptied `people_fusion`, which the behaviour layer reads as the person
    # having gone. It also smooths the range, which is the noisy half of a
    # fused position: the LiDAR range is a percentile over a bearing wedge and
    # jumps by tens of centimetres as that wedge slides off a leg.
    tracking:
      # false republishes the raw per-frame fusion, for comparing a run against
      # the unfiltered pipeline.
      enabled: true
      # `people_fusion` is published on this timer rather than on arrival of a
      # detection, so it keeps a steady rate through a run of rejections.
      publish_rate: 10.0
      # Metres a measurement may sit from a track's prediction and still be
      # taken as the same person. Mostly absorbs the wedge range noise, not
      # walking speed.
      max_association_distance: 0.9
      # Camera-corroborated measurements before a new track is published.
      min_hits: 2
      # Seconds a track survives on prediction alone, with no measurement of
      # any kind. Long enough to cross dropped frames, short enough that
      # someone who walks out stops being reported.
      max_coast_time: 1.2
      # Seconds a track survives on LiDAR-only measurements after the camera
      # last agreed. This is the budget for the long-skirt case; raise it if
      # people are still lost, lower it if a track outlives the person.
      max_uncorroborated_time: 4.0
      # Metres. The scale of the jump when the bearing wedge slides off a leg.
      measurement_noise: 0.25
      # How wrong the constant-velocity assumption is allowed to be, i.e. how
      # readily the estimate follows a person changing direction.
      process_noise: 0.08
      # m/s. Above this is an association error, not a person, so the reported
      # velocity is clamped rather than believed.
      max_reported_speed: 2.5

      # ---- the camera's blind zone ----
      # Requiring the camera to agree only makes sense where the camera could
      # have agreed. It sits on the head at ~0.22 m with a ~36 deg vertical
      # FOV, so a person closer than about a metre has nothing in frame that
      # the pose network can call a body, and a person off to the side is not
      # in the picture at all -- which is most of a leading trial, since the
      # human being led walks behind the robot. In neither place is the
      # camera's silence evidence that nobody is there, so a track there holds
      # its max_uncorroborated_time instead of spending it, and a consistent
      # run of LiDAR-only measurements may start one.
      #
      # The exemption is bounded on three sides: the geometry below, the
      # unchanged max_coast_time (a track nothing is measuring still dies in
      # ~1 s), and max_blind_zone_time. Set both exempt_* false to go back to
      # demanding corroboration everywhere.
      camera_frame: mecanumbot/head_link
      exempt_close_range: true
      exempt_outside_fov: true
      # Metres from the camera within which there is not enough of a person in
      # frame to detect, whatever the gate thresholds are.
      camera_blind_range: 0.9
      # Half the camera's horizontal FOV. 30 deg is the ~60 deg horizontal of
      # the 16:9 frame whose vertical is the ~36 deg quoted above.
      camera_half_fov_deg: 30.0
      # Seconds a track may be reported on the exemption before the camera has
      # to agree again regardless. Past it the track is silenced rather than
      # dropped -- it keeps absorbing the LiDAR returns, so no replacement is
      # spawned, and one corroborated frame brings the person straight back.
      # Sized for a human walking at the robot's shoulder for a whole leading
      # leg; lower it if a track outlives a person who left through the blind
      # zone.
      max_blind_zone_time: 30.0
      # Consecutive LiDAR-only measurements inside the blind zone that confirm
      # a track the camera never vouched for. Higher than min_hits on purpose:
      # this is the only path by which the LiDAR alone asserts a person, so it
      # is paid for in consistency. Five hits is half a second at 10 Hz.
      blind_zone_min_hits: 5
      # false keeps the original rule -- only the camera introduces a person --
      # while still holding the corroboration clock for existing tracks.
      blind_zone_creates_tracks: true

    # ==========================================================================
    # The camera, as this node has to model it
    # ==========================================================================
    # The pose detector publishes bearings and keeps its own copy of these; the
    # fetch detector publishes boxes in pixels and leaves the conversion here,
    # which is where the range has to be worked out anyway. So both nodes hold
    # the same three numbers and nothing checks them against each other -- they
    # never talk. A box arriving outside the declared frame is warned about
    # once, which is the cheapest symptom of their having drifted apart.
    camera_params:
      camera_width: 1280
      camera_height: 720
      camera_fov: 1.0471975512   # 60 deg
      # 0.0 derives the vertical field of view from the frame shape, assuming
      # square pixels, which every camera on this robot has.
      camera_vfov: 0.0

    # ==========================================================================
    # The fetch game's ball
    # ==========================================================================
    # The LiDAR cannot help here at all: it scans one horizontal plane about
    # 0.12 m up and a tennis ball on the floor is never in it, so a range looked
    # up inside the ball's bearing would be the range of the wall behind it.
    # Both bearing and range come from the camera. See ball_locating.py.
    ball:
      enabled: true
      boxes_topic: cam_ball_boxes
      # The label the located ball is published under, on ball_detections. The
      # fetch tree matches on this string.
      class_id: sports ball
      # How long a box message stays usable, as with the person bearings.
      detection_timeout: 0.6
      # ball_fusion is published on this timer rather than on arrival, so a
      # behaviour can tell "no ball for a second" from "the detector has said
      # nothing since the run started".
      publish_rate: 10.0
      # A regulation tennis ball [m]. Every apparent-size range scales with it.
      diameter: 0.067

      # Which estimator supplies the published range:
      #   size          -- from the ball's apparent diameter. Needs only the
      #                    lens, does not care where the camera points, and is
      #                    the safe default because it depends on nothing that
      #                    has to be measured on the robot.
      #   ground_plane  -- where the ray meets the floor. Better close in, and
      #                    the one to switch to once camera_z and
      #                    camera_pitch_deg below have actually been measured.
      range_source: size

      # Where the camera sits in the robot's base frame [m], and where the floor
      # is in it. These are NOT read from the URDF, and cannot be: head_link is
      # rotated 90 deg about x and camera_link another 90 about y, so neither is
      # an x-forward, z-up frame and neither gives the camera's height without
      # unpicking two rotations written for the meshes. Measure them on the
      # robot. base_link sits 0.01 m above base_footprint, so the floor is a
      # centimetre below the base frame's origin.
      camera_x: 0.13
      camera_z: 0.21
      # Positive looks UP. The neck tilts, so a tree that sweeps the head while
      # searching either keeps this in step with the pose it commanded or stays
      # on range_source: size, which does not care.
      camera_pitch_deg: 0.0
      floor_z: -0.01
      # Nearer than the first the ball is under the camera's chin; further than
      # the second the box is a few pixels and the 1/d_px error swamps it.
      min_range: 0.15
      max_range: 6.0
      # Metres the two estimators may differ by before it is worth saying so.
      # They measure the same distance by unrelated routes, so a persistent gap
      # is evidence that camera_z, camera_pitch_deg or diameter is wrong --
      # which nothing else can tell you, because each estimator on its own
      # produces a perfectly plausible number from wrong inputs.
      disagreement_warn: 0.6

      # Alpha-beta smoothing in the map frame. Lighter than the person tracker
      # on purpose: a ball is one cleanly-shaped unambiguous target with none of
      # a crowd's association problems. What the filter is for is the range
      # noise -- an apparent-size range goes as 1/d_px, so a pixel of box jitter
      # at 4 m is about 20 cm -- and the frames where the ball is behind a chair
      # leg.
      tracking:
        max_association_distance: 0.6
        min_hits: 2
        # Short: a ball that has been picked up should stop being reported
        # quickly, or the robot keeps driving at the floor where it was.
        max_coast_time: 1.0
        position_gain: 0.5
        velocity_gain: 0.12
        max_speed: 3.0

    # ---- person boxes from the fetch detector ----
    # Its person boxes become the same bearing wedge a CamPersonDetection
    # carries, which is all this node ever used of one. Harmless with both
    # detectors running: the two wedges land on the same person and the
    # tracker's association absorbs the duplicate.
    person_boxes:
      enabled: true
      topic: cam_people_boxes

# ==============================================================================
# The fetch game's detector: one plain YOLO pass that finds people AND balls.
# ==============================================================================
# Runs *instead of* mecanumbot_cam_detect_objects_ds's pose sibling above, not
# alongside it -- two networks on one camera stream is most of an Orin Nano's
# GPU. The trade is explicit: this model gives up the skeletons (so no ostensive
# gestures, and person detections are judged on the box alone) and gains a
# second class, which is the only way a tennis ball is ever detected. Both
# detectors feed the same `mecanumbot_locate_detections`, which accepts person
# evidence in either form, so `people_fusion` keeps flowing whichever is up.
mecanumbot_cam_detect_objects_ds:
  ros__parameters:
    # ---- the detection model ----
    # Same folder-per-input-size layout as the pose model: imgsz picks
    # models/imgsz_<n>/ and model_name the file in it. yolo26m is the COCO
    # 80-class detector; conv_to_onnx.py exports it the same way as the pose
    # checkpoints. 640 rather than 1280: a tennis ball is small, but the extra
    # resolution costs more than it buys once the ball is close enough to be
    # worth driving at, and this network runs alongside nothing.
    model_params:
      imgsz: 640
      model_name: yolo26m
      # fp16 | fp32 -- must match network-mode in the nvinfer config
      # (fp16 -> 2, fp32 -> 0), since the precision is part of the engine name.
      precision: fp16
      # Empty means the package share models/ folder.
      models_dir: ''
      # Where DeepStream-Yolo (NOT DeepStream-Yolo-Pose -- a different library
      # with a different parser) was built; ~, $HOME and $USER are expanded.
      # Empty tries the custom-lib-path in config_infer_yolo26_det.txt, then
      # DeepStream-Yolo/ under ~/deepstream_source (the robot) and
      # ~/Documents/installed_external (a laptop). Set, it is the only path
      # tried.
      custom_lib_path: ''
      # A complete nvinfer config to hand to nvinfer untouched; setting it
      # disables all of the substitution above.
      nvinfer_config: ''

    # ---- which classes, and what to call them ----
    # COCO numbering, for the shipped model. A re-trained model renumbers them,
    # which is why they are parameters; the labels are what travels downstream,
    # because a numeric id means nothing once the detection has left the camera.
    classes:
      person_id: 0
      person_label: person
      person_topic: cam_people_boxes
      ball_id: 32
      ball_label: sports ball
      ball_topic: cam_ball_boxes

    # ---- the person gate ----
    # There are no keypoints here to judge a person on, so what is left of the
    # three-stage gate is hysteresis and temporal confirmation (see
    # object_gating.py). The shape bounds are deliberately wide: a person close
    # to the camera is wider than tall, and the work of not believing a coat
    # rack is a person is done downstream, where the LiDAR has to agree there is
    # something at that bearing.
    person_gate:
      conf_acquire: 0.5
      conf_retain: 0.3
      min_size: 20.0
      min_aspect: 0.05
      max_aspect: 2.5
      min_hits: 2
      max_missed_time: 0.5
      iou_threshold: 0.3

    # ---- the ball gate ----
    # A tennis ball is round, so its box is square at every range and from every
    # direction -- no other object in this system has that property, and the
    # aspect bounds are the cheapest thing separating a ball from a yellow floor
    # marking or a reflection. Not 1.0 +- nothing, because a ball in flight
    # smears and a ball against a chair leg is clipped.
    ball_gate:
      # Lower than the person's: a ball is small, scores lower, and a false ball
      # costs one wasted drive, where a false person costs a social act.
      conf_acquire: 0.4
      conf_retain: 0.25
      # Pixels on the shorter side. At 640x480-equivalent geometry a ball at 5 m
      # is about 15 px, so this is roughly "no further than the room is wide".
      min_size: 6.0
      min_aspect: 0.55
      max_aspect: 1.8
      min_hits: 2
      max_missed_time: 0.4
      iou_threshold: 0.2

    # Draws every box, accepted or refused, with the check it failed, on
    # cam_object_detections/debug_image/compressed. For tuning; costs a JPEG
    # encode per frame.
    debug_mode: false
    log_rejections: false
