mecanumbot_lidar_detect_people:
  ros__parameters:
    weight_file: dr_spaam_5_on_frog.pth
    conf_thresh: 0.45
    scan_topic: /mecanumbot/scan
    detections_topic: dr_spaam/dets
    rviz_topic: dr_spaam/marker

    # ---- GPU load control (Jetson Orin Nano) ----
    # stride subsamples the cutout centres fed to the network: 2 halves the
    # number of cutouts, and therefore roughly halves both GPU and CPU time.
    # Set back to 1 for the original (heavier) sampling density.
    stride: 2
    # Cap how often DR-SPAAM actually runs, independent of the LiDAR rate. The
    # Kalman tracker extrapolates the scans in between, so `dets` and
    # `subject_pose` still update at full scan rate. 0.0 disables the cap.
    max_inference_rate: 5.0
    publish_on_skipped_scans: true
    # FP16 autocast for the convolutions. Validated at start-up; the node falls
    # back to FP32 on its own if the model misbehaves in half precision.
    use_amp: true
    cudnn_benchmark: true
    torch_threads: 2
    # Skip inference entirely when no return is closer than this many metres
    # (nothing to detect). 0.0 disables the check.
    idle_skip_range: 0.0
    expected_points: 240
    angle_increment: 0.026
    # Seconds between throughput reports; 0.0 disables them.
    perf_log_period: 0.0

    # ---- tracker (ages in seconds, so it is independent of the rates above) ----
    track_max_distance: 0.5
    track_max_missed_time: 0.4
    track_min_hits: 2

mecanumbot_cam_detect_people_ds:
  ros__parameters:
    # ---- ROS4HRI (REP-155) output, alongside the mecanumbot-native messages ----
    ros4hri:
      enabled: true
      prefix: /humans
      publish_rate: 30.0
      body_timeout: 0.5
      publish_roi: true
      iou_threshold: 0.3
      # Empty means "reuse the frame the native detections use" (<ns>/head_link).
      frame_id: ''
    # How to invert the nvinfer input resize when mapping keypoints back to
    # pixels: letterbox | stretch | auto (auto reads maintain-aspect-ratio from
    # deepstream_config/config_infer_yolo26_pose.txt).
    keypoint_scaling: letterbox

    # ---- detection gate ----
    # A detection is accepted on keypoint evidence and temporal consistency,
    # not on the box score alone: a bean bag or an occluder can score a
    # plausible box while producing no coherent skeleton, and a partly
    # occluded person scores lower than one that does. See person_gating.py.
    detection_gate:
      # Box confidence to *acquire* an unknown blob vs. to *retain* one already
      # confirmed. Retain must be the looser of the two -- that hysteresis is
      # what keeps a person who turns away or is briefly occluded.
      # Note the nvinfer pre-cluster-threshold (0.25) is a hard floor: nothing
      # below it ever reaches this node.
      box_conf_acquire: 0.6
      box_conf_retain: 0.35
      # Joint visibility. Decides which keypoints are usable, NOT whether the
      # object is a person, so it is deliberately far below the box gates;
      # raising it to the box threshold is what made distant people lose all
      # their keypoints.
      keypoint_conf: 0.3
      # Keypoint evidence: how much of a body has to be found. This is the
      # check props actually fail. Raise the acquire values if bean bags still
      # get through, lower them if people at range are missed.
      best_keypoint_conf_acquire: 0.7
      best_keypoint_conf_retain: 0.5
      min_valid_keypoints_acquire: 6
      min_valid_keypoints_retain: 3
      # Of the four shoulder/hip joints. A body has a torso; a cushion does not.
      min_torso_keypoints_acquire: 2
      min_torso_keypoints_retain: 1
      # Box geometry, applied in both modes. People are taller than wide;
      # floor props are squat. Raise max_box_aspect_ratio if people are
      # expected seated or very close to the camera.
      min_box_height: 40.0
      max_box_aspect_ratio: 1.6
      # ---- close range ----
      # The camera sits on the head at about 0.22 m with a ~36 deg vertical
      # FOV, so from roughly 3 m in a person's torso is above the top of the
      # frame and only their legs are left: at 0.6 m the camera sees the world
      # from the floor to about 0.4 m. Requiring a torso of them cannot be
      # met, and close is where a person matters most. A box that starts at
      # the top edge (the body continues above the FOV) and fills most of the
      # frame height is therefore judged on these thresholds instead, with the
      # hip/knee/ankle count standing in for the torso -- a panel or a bean
      # bag pressed against the camera has the same geometry but still no leg.
      proximity_enabled: true
      proximity_min_height_fraction: 0.6
      proximity_top_margin: 8.0
      # A cropped body scores lower than a whole one, so the box gates drop.
      proximity_box_conf_acquire: 0.5
      proximity_box_conf_retain: 0.3
      proximity_min_valid_keypoints_acquire: 2
      proximity_min_valid_keypoints_retain: 1
      # Of the six hip/knee/ankle joints. This is what keeps props out.
      proximity_min_lower_body_acquire: 2
      proximity_min_lower_body_retain: 1
      proximity_max_box_aspect_ratio: 2.5
      # Temporal confirmation: frames a blob must pass the acquire gate before
      # it is published, and how long a confirmed track survives without one.
      min_hits: 2
      max_missed_time: 0.5
      iou_threshold: 0.3
      # Logs every rejected box with the check it failed. Verbose; for tuning.
      log_rejections: false
