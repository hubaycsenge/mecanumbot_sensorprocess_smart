mecanumbot_lidar_detect_people:
  ros__parameters:
    weight_file: dr_spaam_5_on_frog.pth
    conf_thresh: 0.45
    scan_topic: /mecanumbot/scan
    detections_topic: dr_spaam/dets
    rviz_topic: dr_spaam/marker

    # ---- GPU load control (Jetson Orin Nano) ----
    # stride subsamples the cutout centres fed to the network: 2 halves the
    # number of cutouts, and therefore roughly halves both GPU and CPU time.
    # Set back to 1 for the original (heavier) sampling density.
    stride: 2
    # Cap how often DR-SPAAM actually runs, independent of the LiDAR rate. The
    # Kalman tracker extrapolates the scans in between, so `dets` and
    # `subject_pose` still update at full scan rate. 0.0 disables the cap.
    max_inference_rate: 5.0
    publish_on_skipped_scans: true
    # FP16 autocast for the convolutions. Validated at start-up; the node falls
    # back to FP32 on its own if the model misbehaves in half precision.
    use_amp: true
    cudnn_benchmark: true
    torch_threads: 2
    # Skip inference entirely when no return is closer than this many metres
    # (nothing to detect). 0.0 disables the check.
    idle_skip_range: 0.0
    expected_points: 240
    angle_increment: 0.026
    # Seconds between throughput reports; 0.0 disables them.
    perf_log_period: 0.0

    # ---- tracker (ages in seconds, so it is independent of the rates above) ----
    track_max_distance: 0.5
    track_max_missed_time: 0.4
    track_min_hits: 2

mecanumbot_cam_detect_people_ds:
  ros__parameters:
    # ---- ROS4HRI (REP-155) output, alongside the mecanumbot-native messages ----
    ros4hri:
      enabled: true
      prefix: /humans
      publish_rate: 30.0
      body_timeout: 0.5
      publish_roi: true
      iou_threshold: 0.3
      # Empty means "reuse the frame the native detections use" (<ns>/head_link).
      frame_id: ''
    # ---- pose model ----
    # The ONNX exports are stored one folder per input size, models/imgsz_<n>/.
    # imgsz picks the folder and model_name the file in it; the node rewrites
    # onnx-file, model-engine-file and infer-dims in a copy of
    # deepstream_config/config_infer_yolo26_pose.txt to match, so the three
    # never drift apart. Both are set from the base launch (yolo_imgsz,
    # yolo_model), which overrides whatever is written here.
    model_params:
      # fp16 | fp32 -- must match network-mode in the nvinfer config
      # (fp16 -> 2, fp32 -> 0), since the precision is part of the engine name.
      precision: fp16
      # Empty means the package share models/ folder. Point it at the source
      # tree on the robot if nvinfer should build its engines where they
      # survive a rebuild.
      models_dir: ''
      # Where DeepStream-Yolo-Pose was built. Empty keeps the custom-lib-path
      # written in the nvinfer config.
      custom_lib_path: ''
      # A complete nvinfer config to hand to nvinfer untouched; setting it
      # disables all of the substitution above.
      nvinfer_config: ''

    # How to invert the nvinfer input resize when mapping keypoints back to
    # pixels: letterbox | stretch | auto (auto reads maintain-aspect-ratio from
    # deepstream_config/config_infer_yolo26_pose.txt). Keep this on auto: the
    # config sets maintain-aspect-ratio=0, so nvinfer stretches rather than
    # pads, and the letterbox mapping then invents padding that is not there --
    # at 1280x720 that puts every joint at 1.78*y - 280 whatever the network
    # size, which is a skeleton stretched off the bottom of its own box.
    keypoint_scaling: auto

    # ---- detection gate ----
    # A detection is accepted on keypoint evidence and temporal consistency,
    # not on the box score alone: a bean bag or an occluder can score a
    # plausible box while producing no coherent skeleton, and a partly
    # occluded person scores lower than one that does. See person_gating.py.
    detection_gate:
      # Box confidence to *acquire* an unknown blob vs. to *retain* one already
      # confirmed. Retain must be the looser of the two -- that hysteresis is
      # what keeps a person who turns away or is briefly occluded.
      # Note the nvinfer pre-cluster-threshold (0.25) is a hard floor: nothing
      # below it ever reaches this node.
      box_conf_acquire: 0.6
      box_conf_retain: 0.35
      # Joint visibility. Decides which keypoints are usable, NOT whether the
      # object is a person, so it is deliberately far below the box gates;
      # raising it to the box threshold is what made distant people lose all
      # their keypoints.
      keypoint_conf: 0.3
      # Keypoint evidence: how much of a body has to be found. This is the
      # check props actually fail. Raise the acquire values if bean bags still
      # get through, lower them if people at range are missed.
      best_keypoint_conf_acquire: 0.7
      best_keypoint_conf_retain: 0.5
      min_valid_keypoints_acquire: 6
      min_valid_keypoints_retain: 3
      # Of the four shoulder/hip joints. A body has a torso; a cushion does not.
      min_torso_keypoints_acquire: 2
      min_torso_keypoints_retain: 1
      # Box geometry, applied in both modes. People are taller than wide;
      # floor props are squat. Raise max_box_aspect_ratio if people are
      # expected seated or very close to the camera.
      min_box_height: 40.0
      max_box_aspect_ratio: 1.6
      # ---- close range ----
      # The camera sits on the head at about 0.22 m with a ~36 deg vertical
      # FOV, so from roughly 3 m in a person's torso is above the top of the
      # frame and only their legs are left: at 0.6 m the camera sees the world
      # from the floor to about 0.4 m. Requiring a torso of them cannot be
      # met, and close is where a person matters most. A box that starts at
      # the top edge (the body continues above the FOV) and fills most of the
      # frame height is therefore judged on these thresholds instead, with the
      # hip/knee/ankle count standing in for the torso -- a panel or a bean
      # bag pressed against the camera has the same geometry but still no leg.
      proximity_enabled: true
      proximity_min_height_fraction: 0.6
      # How near the top edge the box has to start, in pixels and as a
      # fraction of the frame height; the larger of the two wins. The box is
      # drawn round the body the network found, not round the person, so on
      # loose clothing -- a long skirt, a coat -- the top lands tens of pixels
      # inside the frame and an absolute 8 px could not be met: the detection
      # then fell back on the full-body gate and was rejected for a torso that
      # was never in shot. 0.08 is 58 px at 720p.
      proximity_top_margin: 8.0
      proximity_top_fraction: 0.08
      # ... and the escape hatch when even that fails: a box filling this much
      # of the frame is close whatever its top edge does, because nothing far
      # away is that big. The lower-body keypoint count below is what still
      # has to be satisfied, so this does not let a prop through.
      proximity_dominant_height_fraction: 0.85
      # A cropped body scores lower than a whole one, so the box gates drop.
      proximity_box_conf_acquire: 0.4
      proximity_box_conf_retain: 0.3
      # Knees and ankles score lower than faces and shoulders, so the
      # whole-body best_keypoint_conf_* is unmeetable on a legs-only view.
      proximity_best_keypoint_conf_acquire: 0.5
      proximity_best_keypoint_conf_retain: 0.35
      proximity_min_valid_keypoints_acquire: 2
      proximity_min_valid_keypoints_retain: 1
      # Of the six hip/knee/ankle joints. This is what keeps props out.
      proximity_min_lower_body_acquire: 2
      proximity_min_lower_body_retain: 1
      proximity_max_box_aspect_ratio: 2.5
      # Temporal confirmation: frames a blob must pass the acquire gate before
      # it is published, and how long a confirmed track survives without one.
      min_hits: 2
      max_missed_time: 0.5
      iou_threshold: 0.3
      # Logs every rejected box with the check it failed. Verbose; for tuning.
      log_rejections: false

# Fuses the camera bearings with the LiDAR ranges and publishes `people_fusion`,
# which is the single interface the behaviour layer consumes. The node had no
# section here before, so everything below used to be a hard-coded default.
mecanumbot_locate_detections:
  ros__parameters:
    # Metres to place a detection behind a mapped wall it appears to be inside.
    obstacle_buffer_x: 0.5
    debug_mode: false
    # How long the last CamPersonDetectionArray stays usable. The camera is the
    # slower of the two inputs, so its bearings are deliberately re-used
    # between messages -- but only this long: past it the person may have left,
    # and a stale wedge would keep placing them wherever the scan hits inside
    # it. Keep it at a few camera frames.
    cam_detection_timeout: 0.6

    # ---- map-frame tracking (see person_tracking.py) ----
    # A constant-velocity Kalman estimate per person. It exists because the
    # camera gate rejects real people -- a long skirt or a tablecloth gives the
    # pose network no skeleton to find -- and before this every rejection
    # emptied `people_fusion`, which the behaviour layer reads as the person
    # having gone. It also smooths the range, which is the noisy half of a
    # fused position: the LiDAR range is a percentile over a bearing wedge and
    # jumps by tens of centimetres as that wedge slides off a leg.
    tracking:
      # false republishes the raw per-frame fusion, for comparing a run against
      # the unfiltered pipeline.
      enabled: true
      # `people_fusion` is published on this timer rather than on arrival of a
      # detection, so it keeps a steady rate through a run of rejections.
      publish_rate: 10.0
      # Metres a measurement may sit from a track's prediction and still be
      # taken as the same person. Mostly absorbs the wedge range noise, not
      # walking speed.
      max_association_distance: 0.9
      # Camera-corroborated measurements before a new track is published.
      min_hits: 2
      # Seconds a track survives on prediction alone, with no measurement of
      # any kind. Long enough to cross dropped frames, short enough that
      # someone who walks out stops being reported.
      max_coast_time: 1.2
      # Seconds a track survives on LiDAR-only measurements after the camera
      # last agreed. This is the budget for the long-skirt case; raise it if
      # people are still lost, lower it if a track outlives the person.
      max_uncorroborated_time: 4.0
      # Metres. The scale of the jump when the bearing wedge slides off a leg.
      measurement_noise: 0.25
      # How wrong the constant-velocity assumption is allowed to be, i.e. how
      # readily the estimate follows a person changing direction.
      process_noise: 0.08
      # m/s. Above this is an association error, not a person, so the reported
      # velocity is clamped rather than believed.
      max_reported_speed: 2.5
